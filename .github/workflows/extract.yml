name: Extract website ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          mkdir extracted
          unzip -q CLB_Karate_TH_Binh_Thuan_Website.zip -d extracted
          if [ -d extracted/CLB_Karate_TH_Binh_Thuan_Website ]; then
            cp -R extracted/CLB_Karate_TH_Binh_Thuan_Website/. .
          else
            cp -R extracted/. .
          fi
          rm -rf extracted
          rm -f CLB_Karate_TH_Binh_Thuan_Website.zip

      - name: Save files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract website source"
          git push
