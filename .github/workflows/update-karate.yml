name: Update Karate Website

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract and update files
        run: |
          mkdir -p temp
          unzip -q CLB_Karate_TH_Binh_Thuan_Cap_Nhat.zip -d temp
          cp temp/CLB_Karate_TH_Binh_Thuan/src/App.jsx CLB_Karate_TH_Binh_Thuan/src/App.jsx
          cp temp/CLB_Karate_TH_Binh_Thuan/src/style.css CLB_Karate_TH_Binh_Thuan/src/style.css
          cp temp/CLB_Karate_TH_Binh_Thuan/supabase/update_existing.sql CLB_Karate_TH_Binh_Thuan/supabase/update_existing.sql
          cp temp/CLB_Karate_TH_Binh_Thuan/README.md CLB_Karate_TH_Binh_Thuan/README.md

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update Karate website" || echo "No changes"
          git push
